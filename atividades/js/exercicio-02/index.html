<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exercício 2</title>
  </head>
  <body>
    <label for="preco">Preço (R$):</label>
    <input type="number" id="preco" value="0" step="0.01" />

    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" value="0" />

    <h3>Total: R$ <span id="valor-total">0.00</span></h3>

    <script>
      const inputPreco = document.getElementById("preco");
      const inputQuantidade = document.getElementById("quantidade");
      const elementoTotal = document.getElementById("valor-total");

      function calcularTotal() {
        const preco = parseFloat(inputPreco.value) || 0;
        const quantidade = parseInt(inputQuantidade.value) || 0;
        const total = preco * quantity;

        elementoTotal.textContent = total.toFixed(2);
      }

      inputPreco.addEventListener("input", calcularTotal);
      inputQuantidade.addEventListener("input", calcularTotal);
    </script>
  </body>
</html>
